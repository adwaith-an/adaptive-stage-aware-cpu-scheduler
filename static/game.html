
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Adaptive Space Shooter</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #07111f; color: #f1f5f9;
  font-family: Arial, sans-serif; text-align: center;
}
header { padding: 14px 8px 5px; }
h1 { font-size: 23px; margin: 4px; color: #67e8f9; }
p { color: #bac8dc; margin: 8px; }
#game {
  display: block; width: min(94vw, 520px); height: min(62vh, 560px);
  margin: 10px auto; border: 2px solid #254763; border-radius: 12px;
  background: #050b18; touch-action: none;
}
button {
  border: 0; border-radius: 10px; padding: 13px 20px; margin: 5px;
  background: #0891b2; color: white; font-size: 16px; font-weight: bold;
}
button:active { transform: scale(.97); }
#status { color: #67e8f9; min-height: 22px; }
.small { font-size: 13px; color: #9fb1c9; }
</style>
</head>
<body>
<header>
  <h1>🚀 Adaptive Space Shooter</h1>
  <p>Move your ship and shoot the falling asteroids!</p>
  <p>Score: <strong id="score">0</strong> &nbsp; | &nbsp; Lives: <strong id="lives">3</strong></p>
  <p id="status">Menu — ready to launch</p>
</header>

<canvas id="game" width="480" height="600"></canvas>
<div>
  <button id="start">▶ Start Game</button>
  <button id="left">◀ Left</button>
  <button id="shoot">🔥 Shoot</button>
  <button id="right">Right ▶</button>
  <button id="menu">↩ Menu</button>
</div>
<p class="small">Game stage updates will connect to the laptop dashboard.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreLabel = document.getElementById("score");
const livesLabel = document.getElementById("lives");
const statusLabel = document.getElementById("status");

let ship = { x: 240, y: 525 };
let bullets = [], rocks = [], stars = [];
let score = 0, lives = 3, running = false;
let keys = { left: false, right: false, shoot: false };
let lastShot = 0, lastRock = 0, lastFrame = 0;
let stage = "Background / Menu";
let networkMessage = "Dashboard connection not tested yet";

for (let i = 0; i < 65; i++) {
  stars.push({ x: Math.random()*480, y: Math.random()*600,
               size: Math.random()*2+1 });
}

async function setStage(nextStage) {
  stage = nextStage;
  statusLabel.textContent = nextStage + " — " + networkMessage;
  try {
    const response = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ stage: nextStage, policy: "AUTO" })
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const result = await response.json();
    networkMessage = "Dashboard updated: " + result.policy_name;
    statusLabel.textContent = stage + " — " + networkMessage;
  } catch (error) {
    networkMessage = "Dashboard connection failed";
    statusLabel.textContent = stage + " — " + networkMessage;
  }
}

function resetGame() {
  ship = { x: 240, y: 525 };
  bullets = []; rocks = [];
  score = 0; lives = 3;
  scoreLabel.textContent = score;
  livesLabel.textContent = lives;
}

function startGame() {
  resetGame();
  running = true;
  setStage("Boot / Launch");
  setTimeout(() => {
    if (running) setStage("Loading Into Match");
  }, 1800);
  setTimeout(() => {
    if (running) setStage("Active Gameplay");
  }, 3500);
}

function goMenu() {
  running = false;
  setStage("Background / Menu");
}

document.getElementById("start").addEventListener("click", startGame);
document.getElementById("menu").addEventListener("click", goMenu);

function bindHold(id, key) {
  const button = document.getElementById(id);
  button.addEventListener("pointerdown", e => {
    e.preventDefault(); keys[key] = true;
  });
  for (const eventName of ["pointerup", "pointercancel", "pointerleave"]) {
    button.addEventListener(eventName, () => keys[key] = false);
  }
}
bindHold("left", "left");
bindHold("right", "right");
bindHold("shoot", "shoot");

canvas.addEventListener("pointerdown", e => {
  if (!running) return;
  moveShipToPointer(e);
});
canvas.addEventListener("pointermove", e => {
  if (running && e.buttons) moveShipToPointer(e);
});
function moveShipToPointer(e) {
  const rect = canvas.getBoundingClientRect();
  ship.x = Math.max(18, Math.min(462,
    (e.clientX - rect.left) / rect.width * 480));
}

function drawShip() {
  ctx.fillStyle = "#67e8f9";
  ctx.beginPath();
  ctx.moveTo(ship.x, ship.y-19);
  ctx.lineTo(ship.x-16, ship.y+16);
  ctx.lineTo(ship.x, ship.y+9);
  ctx.lineTo(ship.x+16, ship.y+16);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#fbbf24";
  ctx.fillRect(ship.x-4, ship.y+15, 8, 8);
}

function draw() {
  ctx.clearRect(0, 0, 480, 600);
  ctx.fillStyle = "#050b18";
  ctx.fillRect(0, 0, 480, 600);

  ctx.fillStyle = "#cbd5e1";
  for (const star of stars) {
    ctx.fillRect(star.x, star.y, star.size, star.size);
    if (running) {
      star.y += 1.1;
      if (star.y > 600) { star.y = 0; star.x = Math.random()*480; }
    }
  }

  if (!running) {
    ctx.fillStyle = "#67e8f9";
    ctx.font = "bold 27px Arial";
    ctx.textAlign = "center";
    ctx.fillText("SPACE SHOOTER", 240, 260);
    ctx.font = "18px Arial";
    ctx.fillStyle = "#e2e8f0";
    ctx.fillText("Press START to play", 240, 300);
    ctx.fillText("Touch the game area to move", 240, 333);
    drawShip();
    requestAnimationFrame(draw);
    return;
  }

  const now = performance.now();
  if (keys.left) ship.x -= 4;
  if (keys.right) ship.x += 4;
  ship.x = Math.max(18, Math.min(462, ship.x));

  if ((keys.shoot || true) && now-lastShot > 280) {
    bullets.push({x: ship.x, y: ship.y-20});
    lastShot = now;
  }

  if (now-lastRock > 700) {
    rocks.push({x: 22+Math.random()*436, y: -15, r: 12+Math.random()*9});
    lastRock = now;
  }

  ctx.fillStyle = "#facc15";
  bullets.forEach(b => {
    b.y -= 8;
    ctx.fillRect(b.x-3, b.y, 6, 14);
  });
  bullets = bullets.filter(b => b.y > -20);

  ctx.fillStyle = "#fb7185";
  for (const r of rocks) {
    r.y += 2.3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.fill();
  }

  for (let i=rocks.length-1; i>=0; i--) {
    const r = rocks[i];
    let hit = false;
    for (let j=bullets.length-1; j>=0; j--) {
      const b = bullets[j];
      if (Math.hypot(r.x-b.x, r.y-b.y) < r.r+5) {
        bullets.splice(j,1);
        hit = true;
        score += 10;
        scoreLabel.textContent = score;
        break;
      }
    }
    if (hit) { rocks.splice(i,1); continue; }
    if (Math.hypot(r.x-ship.x, r.y-ship.y) < r.r+12) {
      rocks.splice(i,1);
      lives--;
      livesLabel.textContent = lives;
      if (lives <= 0) {
        running = false;
        setStage("Spectating");
        statusLabel.textContent = "Game over! Score: " + score;
      }
    } else if (r.y > 620) {
      rocks.splice(i,1);
    }
  }

  drawShip();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
